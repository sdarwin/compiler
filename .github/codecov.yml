#
# Codecov configuration (https://docs.codecov.com/docs/codecov-yaml).
# Reports are uploaded by the test legs of
# .github/workflows/build-and-test-ci.yml, one per test config (flag).

codecov:
  # Post coverage results even when a test leg fails.
  require_ci_to_pass: false
  notify:
    # One upload per test leg: edg_x86_64, edg_x86_64_cp, edg_x86_32,
    # edg_x86_32_cp.
    after_n_builds: 4

coverage:
  precision: 2
  round: down
  range: "20...80"
  status:
    # Report, but never fail, the project and patch checks.
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "header, diff, flags, files, footer"
  behavior: default
  require_changes: false

# Only src/ is reported (see the gcovr --filter in build-and-test-ci.yml);
# keep the rest of the tree out of Codecov's view even if a report includes
# it.
ignore:
  - "benchmarks/**"
  - "dev_tools/**"
  - "tests/**"
  - "util/**"
