#
# Measures code coverage of the front end (src/) and uploads it to Codecov.
#
# Builds linux-gcc-debug with EDG_CPFE_USE_GCOV=ON (gcc --coverage), runs the
# day-posture test set (the default edg_x86_64 and edg_x86_64_cp configs,
# equivalent to `edg-docker-test --non-interactive`), converts the gcov data
# to a Cobertura XML report with gcovr, and uploads it with the Codecov
# action.
#
# Build, test, and report must share one job: the .gcda files are written to
# the absolute object paths baked into the instrumented binaries.
#
# Test failures do not fail this workflow; correctness is the job of
# build-and-test-ci.yml. Coverage is still reported for whatever ran.

name: Coverage

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GCOVR_VERSION: '8.7'
  BUILD_DIR: build/gcc-coverage

jobs:
  coverage:
    name: Coverage linux-gcc-debug
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: ghcr.io/edgcpp/ci-runner@sha256:14b3948c2ce12cfa5472e5a6c468393d15426f3a67685cc35d830ea5db2acdf8
      # Required for setarch ... -R (disable ASLR) used by the test harness.
      options: --privileged
    defaults:
      run:
        shell: edg-container-exec "bash -eo pipefail {0}"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure linux-gcc-debug with gcov
        run: |
          export EDG_BASE="${GITHUB_WORKSPACE}/bases/docker/dev-env/gcc"
          cmake --preset linux-gcc-debug -B "${BUILD_DIR}" \
            -DEDG_CPFE_USE_GCOV=ON

      - name: Build linux-gcc-debug with gcov
        run: |
          export EDG_BASE="${GITHUB_WORKSPACE}/bases/docker/dev-env/gcc"
          cmake --build "${BUILD_DIR}"

      # The build itself runs cpfe (e.g. to generate the runtime libraries);
      # start from zero so only the tests are measured.
      - name: Reset coverage counters
        run: find "${BUILD_DIR}" -name '*.gcda' -delete

      - name: Run edgy (day posture)
        continue-on-error: true
        run: |
          export EDG_BASE="${GITHUB_WORKSPACE}/bases/docker/dev-env/gcc"
          source "${BUILD_DIR}/environment.sh"
          edgy --timeout=600

      - name: Install gcovr
        run: |
          python3 -m venv "${RUNNER_TEMP}/gcovr"
          "${RUNNER_TEMP}/gcovr/bin/pip" install --quiet \
            "gcovr==${GCOVR_VERSION}"

      # cpfe and cpfe-cp compile the same sources; separate function merging
      # keeps gcovr from rejecting functions seen at different lines. A few
      # hot loops (e.g. in symbol_tbl.c) exceed gcovr's "suspicious hits"
      # threshold over the full test set; warn about them instead of failing.
      - name: Generate coverage report
        run: |
          "${RUNNER_TEMP}/gcovr/bin/gcovr" \
            --root . \
            --filter 'src/' \
            --merge-mode-functions=separate \
            --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
            --gcov-ignore-parse-errors=suspicious_hits.warn_once_per_file \
            -j "$(nproc)" \
            --cobertura coverage.xml \
            --print-summary \
            "${BUILD_DIR}"

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      # Pull requests from forks have no access to secrets; the Codecov
      # action then falls back to a tokenless upload, which Codecov accepts
      # for public repositories.
      #
      # The report is complete as generated by gcovr, so skip the CLI's own
      # gcov run (plugins: noop) and its "file fixes" pass, which opens every
      # file git tracks and crashes on the dangling symlinks used as test
      # inputs (e.g. tests/.../embed___has_embed/embed___has_embed.c).
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true
          disable_file_fixes: true
          network_filter: src/
          plugins: noop
          flags: linux-gcc-debug
          name: linux-gcc-debug
          fail_ci_if_error: true
          verbose: true
